<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>CSS Scheduler</title>
    <!--
      The theme, before the first paint. React resolves this properly in
      `useTheme`, owned by App, but it arrives a chunk and a render later — long enough for
      a white page to flash at someone who asked for a dark one, which is the
      one moment dark mode is meant to spare them. Same key, same rules as
      `src/lib/theme.ts`; keep the two in step.
    -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('css-scheduler:theme')
          var dark =
            stored === 'dark' ||
            (stored !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        } catch (e) {
          /* No storage, no matchMedia, no theme. Light is the safe default. */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
