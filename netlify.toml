[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback: every route is served by index.html and handled client-side.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The service worker must never be held by a CDN or a browser cache.
#
# It is the one file that decides whether every other file can be replaced, so
# a stale copy is not a stale page — it is an app that can never update itself
# again, on a phone nobody can clear the cache of. Netlify's default is already
# `max-age=0, must-revalidate`; this says so out loud, because the cost of it
# quietly changing is unbounded.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Everything under /assets/ is named by the hash of its own contents, so a
# given URL can never mean anything different. `immutable` saves a
# revalidation round trip per file on a phone, which is where this is used.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Netlify served this as application/octet-stream, which is not a type a
# browser will read a manifest from — caught by `npm run check:deployed` on the
# first deploy that had one. The file is right; only the label was wrong.
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
